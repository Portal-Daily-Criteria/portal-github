<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Portal do Assessor</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Entrada do Portal do Assessor (site público, sem dados). Os dados de cada assessor estão na pasta d, trancados
     (AES-256-GCM); a chave de cada um está no chaveiro da pessoa (pasta k), trancado com a senha dela. */
  :root{--font:'Montserrat',Arial,sans-serif;--bg:#F4F6F9;--card:#FFFFFF;--line:#DCE2EA;--text:#0F1B2D;--muted:#5B6878;--pri:#003662;--pri-h:#0B4A80;--err:#B42318;--ok:#1F7A4D;--inp:#FFFFFF}
  @media (prefers-color-scheme: dark){ :root{--bg:#0D1520;--card:#131E2C;--line:#26354A;--text:#E8EEF6;--muted:#9AA8BA;--pri:#4A90D9;--pri-h:#6AA6E4;--err:#F28B82;--ok:#7CC9A0;--inp:#0D1520} .logo.cl{display:none} .logo.es{display:block} }
  html,body{margin:0;min-height:100%;background:var(--bg);font-family:var(--font);color:var(--text)}
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:16px;box-sizing:border-box}
  .card{width:400px;max-width:100%;background:var(--card);border:0.8px solid var(--line);border-radius:10px;padding:28px 28px 22px;box-sizing:border-box}
  .logo{height:30px;width:auto;display:block;margin-bottom:18px} .logo.es{display:none}
  .t{font-size:17px;font-weight:700}
  .tag{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;color:var(--pri);border:0.8px solid var(--pri);border-radius:6px;padding:2px 6px;margin-left:6px;vertical-align:2px}
  .s{font-size:12px;color:var(--muted);margin:6px 0 18px;line-height:1.55}
  .f{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
  .f label{font-size:11px;font-weight:600;color:var(--muted)}
  .f input{border:0.8px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14px;font-family:var(--font);background:var(--inp);color:var(--text);outline:none}
  .f input:focus{border-color:var(--pri);box-shadow:0 0 0 3px rgba(3,98,194,.15)}
  .btn{appearance:none;width:100%;border:none;border-radius:8px;background:var(--pri);color:#fff;font-family:var(--font);font-size:13.5px;font-weight:600;padding:11px;cursor:pointer;margin-top:4px}
  .btn:hover{background:var(--pri-h)} .btn[disabled]{opacity:.55;cursor:wait}
  .btn:focus-visible,.lnk:focus-visible{outline:2px solid var(--pri);outline-offset:2px}
  .lnk{appearance:none;background:none;border:none;color:var(--muted);font-family:var(--font);font-size:11.5px;cursor:pointer;margin-top:12px;text-decoration:underline;padding:0}
  .msg{font-size:12px;font-weight:600;min-height:18px;margin-top:10px;color:var(--ok)}
  .msg.err{color:var(--err)}
  .foot{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.55;border-top:0.8px solid var(--line);padding-top:12px}
</style>
</head>

    <div class="t">Portal do Assessor</div>
    <div class="s">Entre com o login e a senha que a Mesa Operacional enviou para você.</div>
    <div class="f"><label for="tlLogin">Login</label><input id="tlLogin" autocomplete="username" autocapitalize="none" spellcheck="false"></div>
    <div class="f"><label for="tlSenha">Senha</label><input type="password" id="tlSenha" autocomplete="current-password" placeholder="XXXX-XXXX-XXXX-XXXX"></div>
    <button class="btn" id="tlBtn">Entrar</button>
    <button class="lnk" id="tlEsqueci">Esqueci a senha</button>
    <div class="msg" id="tlMsg" role="status"></div>
    <div class="foot">Os dados ficam trancados com criptografia AES-256 e só abrem com a sua senha, neste navegador. Uso interno: não compartilhe a senha nem o acesso. Abra no Google Chrome ou no Edge.</div>
  </div>
  <script>
  (function(){
    // Sem let/const/function no escopo global: depois do document.write o portal declara os próprios nomes globais.
    var te = new TextEncoder(), erros = 0, esperaAte = 0, MARCA = '/*__PACOTES__*/[]';
    var $ = function(id){ return document.getElementById(id); };
    var msg = function(t, erro){ $('tlMsg').textContent = t || ''; $('tlMsg').className = 'msg' + (erro ? ' err' : ''); };
    var unb64 = function(s){ var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; };
    var hex = function(u){ return Array.from(u, function(x){ return (x < 16 ? '0' : '') + x.toString(16); }).join(''); };
    if (!window.crypto || !crypto.subtle || !window.DecompressionStream){ msg('Este navegador não abre o portal. Use o Google Chrome ou o Edge atualizados.', true); $('tlBtn').disabled = true; return; }
    async function decifrar(chave, blob, rotulo){
      var k = await crypto.subtle.importKey('raw', chave, 'AES-GCM', false, ['decrypt']);
      return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM', iv:blob.subarray(0, 12), additionalData:te.encode(rotulo)}, k, blob.subarray(12)));
    }
    async function gunzipTexto(u){ return await new Response(new Blob([u]).stream().pipeThrough(new DecompressionStream('gzip'))).text(); }
    async function baixar(caminho, tipo){ var r = await fetch(caminho, {cache:'no-store'}); if (!r.ok) throw new Error('nao-achou'); return tipo === 'json' ? r.json() : tipo === 'texto' ? r.text() : new Uint8Array(await r.arrayBuffer()); }
    async function abrir(){
      if (Date.now() < esperaAte) return msg('Muitas tentativas. Aguarde ' + Math.ceil((esperaAte - Date.now()) / 1000) + ' segundos.', true);
      var login = $('tlLogin').value.trim().toLowerCase(), senha = $('tlSenha').value.toUpperCase().replace(/[^A-Z0-9]/g, '');
      if (!login || !senha) return msg('Preencha o login e a senha.', true);
      $('tlBtn').disabled = true; msg('Conferindo a senha...');
      var chaveiro = null;
      try {
        var id = hex(new Uint8Array(await crypto.subtle.digest('SHA-256', te.encode('portal-criteria|' + login)))).slice(0, 32), cam = 'k/' + id + '.json';
        var K = await baixar(cam, 'json');
        var base = await crypto.subtle.importKey('raw', te.encode(senha), 'PBKDF2', false, ['deriveBits']);
        var kek = new Uint8Array(await crypto.subtle.deriveBits({name:'PBKDF2', salt:unb64(K.sal), iterations:K.iter, hash:'SHA-256'}, base, 256));
        chaveiro = JSON.parse(new TextDecoder().decode(await decifrar(kek, unb64(K.dados), cam)));
      } catch (e) { chaveiro = null; }
      if (!chaveiro){
        $('tlBtn').disabled = false; erros++; $('tlSenha').value = '';
        if (erros >= 5){ erros = 0; esperaAte = Date.now() + 30000; return msg('Login ou senha incorretos. Tente de novo em 30 segundos.', true); }
        return msg('Login ou senha incorretos.', true);
      }
      try {
        msg('Abrindo os dados de ' + chaveiro.assessores.length + (chaveiro.assessores.length === 1 ? ' assessor...' : ' assessores...'));
        var pacotes = await Promise.all(chaveiro.assessores.map(async function(x){
          return JSON.parse(await gunzipTexto(await decifrar(unb64(x.k), await baixar(x.a), x.a)));
        }));
        var modelo = await baixar('portal.html', 'texto');
        if (modelo.indexOf(MARCA) < 0) throw new Error('modelo');
        // pacotes + quem entrou (nome do chaveiro), que o portal mostra no canto do menu
        var js = (JSON.stringify(pacotes) + ';window.PORTAL_PESSOA=' + JSON.stringify({nome: chaveiro.nome || ''})).replace(/</g, '\\u003c');
        document.open(); document.write(modelo.replace(MARCA, function(){ return js; })); document.close();
      } catch (e) {
        $('tlBtn').disabled = false;
        msg('A senha está certa, mas os dados não abriram (publicação em andamento?). Recarregue a página em 1 minuto. Se continuar, avise a Mesa Operacional.', true);
      }
    }
    $('tlBtn').onclick = abrir;
    $('tlLogin').onkeydown = function(e){ if (e.key === 'Enter') $('tlSenha').focus(); };
    $('tlSenha').onkeydown = function(e){ if (e.key === 'Enter') abrir(); };
    $('tlEsqueci').onclick = function(){ msg('Peça uma senha nova à Mesa Operacional. A senha antiga para de funcionar na próxima atualização.'); };
    setTimeout(function(){ $('tlLogin').focus(); }, 50);
  })();
  </script>
